name: Deploy to DigitalOcean Droplet

# main branch par push thata j aa workflow chalu thashe
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /var/www/api
            # Discard any runtime changes to tracked files (e.g. old log files) so the pull can't be blocked.
            # .env and node_modules are gitignored, so this never touches them.
            git checkout -- . 2>/dev/null || true
            git pull origin main
            npm install --omit=dev
            pm2 restart fmf-backend --update-env || pm2 start src/index.js --name fmf-backend
            pm2 save
